
name: Record TARS Simulation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg tesseract-ocr
          pip install playwright pillow pytesseract
          python -m playwright install --with-deps chromium

      - name: Record TARS
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" python record_tars.py

      - name: Save recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TARS-Recording
          path: output/
          retention-days: 7
